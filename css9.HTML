<!--write a CSS program to demonstrate CALC function-->
<html>
    <head>
        <title>CALC calc() Demo</title>
        <style>
            .container {
                width: 100px;
                border: 2px solid black;
                padding: 20px;
            }

            .box {
                height: 100px;
                background-color: lightblue;
                /* width = full container width minus 100px*/
                width: calc(0% + 100px); /*calc (a-b)*/ 
            }
        </style>
        <body>
            <h3>CSS calc() Example</h3>
            <div class = "container">
                <div class = "box"></div>
            </div>
        </body>
    </head>
</html>
