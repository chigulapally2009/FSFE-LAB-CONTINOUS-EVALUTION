<html>
<head>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
    }
    .heading {
      text-align: center;
      margin-bottom: 20px;
    }
    .container {
      background-color: grey;
      padding: 50px;
      border-radius: 8px;
      display: flex;
      gap: 16px;
    }
    .card {
      background-color: red;
      color: white;
      padding: 20px;
      border-radius: 6px;
      flex: 1;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1 class="heading">ABC College</h1>
  <div class="container">
    <div class="card">CSE</div>
    <div class="card">ECE</div>
    <div class="card">EEE</div>
  </div>
</body>
</html>
