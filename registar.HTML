<!DOCTYPE html>
<html>
    <head>
        <title>
           Registration Form
        </title>
    </head>
    <body bgcolor = "lightyellow">
        <h1>Employee Registration Form</h1>
        <form action="success.HTML">
        Name :<input type="text" name="a1" placeholder="Enter Name.."><br></br>
        Password :<input type="text" password="a2" placeholder="Enter Password.."><br></br>
        Email :<input type="text" email="a3" placeholder="Enter Email.."><br></br>
        Phone :<input type="text" phone="a4" placeholder="Enter Phone No.."><br></br>
        Age :<input type="text" age="a5" placeholder="Enter Age.."><br></br>
        Gender :<input type="radio" name="a6" value="male">Male 
        <input type="radio" name="a6" value="female">Female
        <input type="radio" name="a6" value="others">Others <br></br>
        Date Of Birth:<input type="date" name="a7" placeholder="Enter DOB"><br></br>
        Preference Interview Time:<input type="time" name="a8" placeholder="Enter Time"><br></br>
        Skills:<input type="radio" name="a9" value="HTML">HTML
        <input type="radio" name="a9" value="CSS">CSS
        <input type="radio" name="a9" value="Java Script">Java Script
        <input type="radio" name="a9" value="PHP">PHP<br></br>
        Upload File : <input type="file" name = "a10" accept ="jpg.png.jpeg"><br><br>
        Address : <textarea name ="a11" required rows = "3" cols="67" placeholder=Address></textarea><br></br>
         Work Experience: <input type = "range" id = "exp" min = "0" max = "100"><br><br>
         LinkedIn Profile: <input type = "text" name = "a11" placeholder = "Enter LinkedIn URL" required><br><br>
            <button type = "submit"> Register</button>
            <button type = "reset"> Clear all</button>

        </form>
    </body>
</html>
