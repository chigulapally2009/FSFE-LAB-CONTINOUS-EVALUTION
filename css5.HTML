<html>
<head><style>
    .container {
      display: grid;                   /* Enable grid */
grid-template-columns: 1fr 1fr 1fr; /* 3 equal columns */
      gap: 10px;              /* Space between items */
      border: 2px solid black;
      padding: 10px;
    }
    .box {
      background: lightgreen;
      padding: 20px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head><body>
<h3>Library Book Categories</h3>
<div class="container">
    <div class="box">science</div>
    <div class="box">maths</div>
    <div class="box">history</div>
    <div class="box">arts</div>
    <div class="box">technology</div>
    <div class="box">litereature</div>
  </div>
</body>
</html>
